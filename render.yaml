services:
  - type: web
    name: smart-rental-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: MAX_UPLOAD_BYTES
        value: "12582912"
      - key: RESET_TOKEN_MINUTES
        value: "15"
      - key: RESET_TOKEN_DELIVERY
        value: simulation
      - key: LATE_PENALTY_MULTIPLIER
        value: "1.0"
